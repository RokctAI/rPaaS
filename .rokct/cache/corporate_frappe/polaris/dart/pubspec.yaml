name: polaris_sdk
description: "polaris_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  file_picker: ^8.0.7
  flutter_riverpod: ^2.5.1
  get_it: ^8.0.0
  drift: ^2.19.0
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  payfast:
    git:
      url: https://github.com/RendaniSinyage/payfast_flutter.git
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^3.2.5
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
