name: comms_sdk
description: "comms_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0 # 19.x adds Windows toasts (flutter_local_notifications_windows)
  timezone: ^0.10.0 # floor required by flutter_local_notifications 19.x
  base_sdk:
    path: ../base
  audioplayers: ^6.5.1 # POS notification sound (matches supacharge's host constraint)
  auto_route: ^9.2.0
  cloud_firestore: ^5.4.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.1.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^3.1.0
  google_fonts: ^6.3.3
  remixicon: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
