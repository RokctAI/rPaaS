name: base_sdk
description: "base_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_animations: ^1.1.1
  auto_route: ^9.2.0
  battery_plus: ^4.0.0
  cached_network_image: ^3.3.1
  calendar_date_picker2: ^1.1.5
  connectivity_plus: ^6.0.5
  dio: ^5.7.0
  file_picker: ^8.0.7
  firebase_messaging: ^15.1.0
  firebase_remote_config: ^5.1.3
  flutter_advanced_switch: 3.1.0
  flutter_native_splash: ^2.4.2
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.1
  get_it: ^8.0.0
  google_fonts: ^6.3.3
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  image: ^4.1.7
  image_cropper: ^8.0.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  lottie: ^3.0.0
  package_info_plus: ^8.2.1
  path_provider: ^2.1.2
  path: ^1.9.0
  drift: ^2.19.0
  # AppDatabase (src/database/app_database.dart) opens drift's NativeDatabase
  # through package:sqlite3, which dlopens libsqlite3.so at runtime. Many
  # physical devices satisfy that from the platform library, but stock
  # Android emulator images (e.g. api-34 google_apis, the CI guided-tour /
  # verify emulators) do not expose it to app linker namespaces - the app
  # dies at boot with "Failed to load dynamic library libsqlite3.so".
  # sqlite3_flutter_libs bundles the library into every APK/AAB so the open
  # is deterministic on all devices. No Dart code changes needed.
  sqlite3_flutter_libs: ^0.5.24
  pull_to_refresh: ^2.0.0
  remixicon: ^1.2.0
  share_plus: ^10.1.1
  shared_preferences: ^2.5.2
  shimmer: ^2.0.0
  top_snackbar_flutter: ^3.1.0
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  drift_dev: ^2.19.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
