name: orders_sdk
description: "orders_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.1.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  confetti: ^0.8.0
  # Direct dep: order_create_sync_handler.dart sends the idempotency-key
  # header via dio's Options (same version rail as base_sdk).
  dio: ^5.7.0
  flutter_rating_bar: ^4.0.1
  flutter_remix: ^0.0.3
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.1.0
  get_it: ^8.0.0
  google_maps_flutter: ^2.9.0
  intl: ^0.19.0
  jiffy: ^6.2.2
  # manager POS slice (src/manager): device location + reverse geocoding for
  # the select-address screen; versions match paas_manager's pubspec.
  location: ^7.0.0
  lottie: ^3.0.0
  osm_nominatim: ^3.0.1
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
