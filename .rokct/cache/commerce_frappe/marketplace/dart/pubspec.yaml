name: marketplace_sdk
description: "marketplace_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  collection: ^1.18.0
  flutter_html: ^3.0.0-alpha.6
  flutter_remix: ^0.0.3
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  flutter_staggered_animations: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.1.0
  get_it: ^8.0.0
  http: ^1.2.2
  intl: ^0.19.0
  jiffy: ^6.2.2
  lottie: ^3.0.0
  package_info_plus: ^8.2.1
  pull_to_refresh: ^2.0.0
  remixicon: ^1.2.0
  share_plus: ^10.1.1
  smooth_page_indicator: ^1.2.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
