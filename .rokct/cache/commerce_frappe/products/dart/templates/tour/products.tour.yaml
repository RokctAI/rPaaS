# Guided-tour fragment for products_sdk (manager role).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# products_sdk itself installs for app_type=manager composes: the foods tab
# hosted at index 1 of merchants_sdk's home shell (FoodsPage installs to the
# shell's import contract path, so it is tab-hosted and declares no route)
# and the create-product modal the shell's FAB opens on that tab. Include it
# only in manager-family app manifests, after `fragment: merchants` has
# landed the shell on /main.
#
# Demo grounding (--dart-define=IS_DEMO=true): products_di.dart swaps in
# MockProducts/MockCategories/MockBrands for the customer-facing facades.
# The manager-side SellerProductsRepositoryFacade / SellerCatalog-
# RepositoryFacade are NOT demo-gated yet, so the foods tab's lists render
# their own empty states in demo builds - truthful for a brand-new shop,
# and the caption below owns that framing. The create-product modal is a
# static form (details tab + stocks tab) and renders fully without data.
# Follow-up (rule #59): demo-gate the two seller facades so the menu still
# shows a stocked demo menu.
#
# Cross-SDK imports below are the established shell contract: FoodsPage
# itself imports merchants_sdk's mainProvider to drive shell scrolling, and
# the shell's FAB (Remix.add_line, remixicon package) is the real widget a
# manager taps to add a product.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: products
imports:
  - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
  - "import 'package:merchants_sdk/src/manager/application/main/main_provider.dart';"
  - "import 'package:remixicon/remixicon.dart';"
steps:
  - key: menu
    title: "Your menu, organised"
    caption: "A new shop starts here - build your menu from *products, add-ons and extras*, each on its own tab."
    action: dart
    settle: 8
    dart: |
      // Land the manager home shell, then select the foods tab (index 1)
      // through the shell's own mainProvider - the same state the bottom
      // navigation buttons drive. Route first: an earlier fragment may have
      // left the app elsewhere.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(1);
  - key: add_product
    title: "List a product in minutes"
    caption: "Name it, price it, stock it - a *new product* is ready to sell in minutes."
    action: dart
    settle: 6
    dart: |
      // On the foods tab the home shell's FAB opens the create-product
      // modal (main_page.dart's _showModalBasedOnFoodTab, foods sub-tab 0).
      // The FAB is the only Remix.add_line on screen; tolerant tap anyway.
      await tester.tap(
        find.byIcon(Remix.add_line).first,
        warnIfMissed: false,
      );
  # Action-only step: close the create-product modal so the next fragment
  # starts from an unobstructed screen. No still is captured here.
  - key: add_product_close
    title: "Close the product form"
    action: dart
    settle: 3
    screenshot: false
    dart: |
      final NavigatorState navigator =
          tester.state(find.byType(Navigator).first);
      // Bounded: at most the one modal sheet is open.
      for (int i = 0; i < 3 && navigator.canPop(); i++) {
        navigator.pop();
        await Future<void>.delayed(const Duration(milliseconds: 500));
      }
