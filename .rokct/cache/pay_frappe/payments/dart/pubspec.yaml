name: payments_sdk
description: "payments_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  crypto: ^3.0.6
  # Windows payment WebView (WebView2 via flutter_inappwebview_windows).
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
