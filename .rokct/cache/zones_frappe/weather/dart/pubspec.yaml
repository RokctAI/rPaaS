name: weather_sdk
description: "weather_sdk - shop-located weather suite (header widget, forecast dialog, extended forecast, rain feedback) ported from paas_pos main's JuvoONE weather/, refork 2026-08. Adaptive: full interactive dialog on large screens, minimal popup-free inline card on small screens."
version: 1.2.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  cached_network_image: ^3.3.1
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  get_it: ^8.0.0
  google_fonts: 6.3.0
  intl: ^0.19.0
  remixicon: ^1.2.0
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
