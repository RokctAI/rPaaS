name: delivery_sdk
description: "delivery_sdk - extracted from paas_customer (refork 2026-07-11); driver role slice ported from paas_driver (2026-08)."
version: 1.3.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  # Driver-template deps migrated from paas_driver's host pubspec: templates/
  # is installed into the host's generated lib/ and compiles host-side, so the
  # host keeps its copies too (workmanager precedent below).
  auto_size_text: ^3.0.0
  calendar_date_picker2: ^1.1.5
  dio: ^5.7.0
  flutter_html: ^3.0.0-alpha.6
  flutter_remix: ^0.0.3
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.1
  get_it: ^8.0.0
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  # Driver-template deps (see auto_size_text note above).
  map_launcher: ^3.3.1
  percent_indicator: ^4.2.2
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.5.2
  # >=0.6 is the Flutter v2-embedding rewrite; 0.5.x still imports the deleted
  # v1 shim (ShimPluginRegistry/PluginRegistrantCallback) and fails
  # :workmanager:compileReleaseKotlin on Flutter 3.29+. 0.10.x needs
  # Flutter >=3.38.0, matching this package's floor.
  workmanager: ^0.10.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
