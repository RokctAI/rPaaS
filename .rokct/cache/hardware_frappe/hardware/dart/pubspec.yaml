name: hardware_sdk
description: "Unified hardware peripheral interface package for RokctApp."
version: 1.0.0
# Internal SDK consumed via path/git, never published to pub.dev. Matches
# base_sdk and keeps the path dependency below from tripping pub's
# publishable-package lint.
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  print_bluetooth_thermal: any
  flutter_riverpod: ^2.6.1
  permission_handler: ^12.0.1
  mobile_scanner: ^6.0.4
  shared_preferences: ^2.5.4
  # Aligned with base_sdk (shared kernel, ADR-005) so the graphs co-resolve.
  freezed_annotation: ^3.1.0
  rxdart: any
  get_it: ^8.0.0

  network_info_plus: any
  ping_discover_network_forked: any
  flutter_pos_printer_platform_image_3: any
  intl: ^0.19.0
  sensors_plus: ^5.0.1

  # Camera capture + stamp capability.
  camera: ^0.11.0
  image: ^4.1.7
  geolocator: ^13.0.1

  # base_sdk supplies the shared LocationService (ADR-005: the one SDK every
  # feature SDK may import directly). Cache-relative path (`../base`) like
  # every other SDK: in a composed host every SDK sits as a sibling under
  # `.rokct/cache/`, and pub resolves this entry there. Standalone resolution
  # in this repo comes from the workspace-relative dependency_overrides below.
  base_sdk:
    path: ../base


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  freezed: ^3.2.3
  build_runner: ^2.10.4

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root, and
# rewritten to the cache layout by sdk_composer's
# _fix_cache_dependency_override_paths when composed.
dependency_overrides:
  http: ^1.2.0
  base_sdk:
    path: ../../../core/base/dart
